.logo{font-weight:900;font-size:20px;cursor:pointer}

.grid{padding:12px;display:grid;grid-template-columns:1fr;gap:10px}

.salary{font-weight:800;color:#2563eb;font-size:12px;white-space:nowrap}

.btnDark{background:#111;color:#fff}
.btnBlue{background:#2563eb;color:#fff}
.btnLight{background:#e5e7eb;color:#111}

.inp:focus{border-color:#2563eb}
.formBox{background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:22px;margin:16px}
